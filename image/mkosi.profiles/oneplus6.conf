# OnePlus 6 (enchilada): jinOS for the phone. Build with
#   mkosi -f --profile oneplus6 build
# Outputs jinos-oneplus6.boot-enchilada.img (flash to boot) and
# jinos-oneplus6.userdata.img (flash to userdata); see devices/oneplus6/README.md.
[Distribution]
Architecture=arm64

[Output]
ImageId=jinos-oneplus6
SplitArtifacts=partitions

[Content]
# The phone's bootloader loads an Android boot image, not EFI.
Bootable=no
Packages=
        # Mobian's sdm845 kernel and Qualcomm support (modem, audio DSP, Wi-Fi,
        # firmware extraction from the Android partitions). This is what
        # sdm845-support pulls in, except that Mobian's forky snapshot still
        # pairs it with kernel 6.12; staging (current Mobian) uses 6.18, which
        # also supports the main rear camera.
        qcom-support-common
        linux-image-6.18-sdm845
        initramfs-tools
        # SSH over the USB cable while bringing the phone up.
        openssh-server
        # Vibration motor and notification LED patterns for this phone.
        feedbackd-device-themes
        # Sensors (rotation, proximity during calls, light) live on the
        # sensor DSP; hexagonrpcd serves it the sensor files droid-juicer
        # extracts, and iio-sensor-proxy reads them through libssc.
        hexagonrpcd
        # Camera: Plasma Camera on libcamera (Mobian: front and both rear
        # cameras work on kernel 6.18).
        plasma-camera
        libcamera-ipa
        pipewire-libcamera
ExtraTrees=%D/devices/oneplus6/mkosi.extra
PostInstallationScripts=%D/devices/oneplus6/postinst.chroot
PostOutputScripts=%D/devices/oneplus6/postoutput

[Build]
# Mobian's repository for the build; mkosi.extra puts it in the image too.
SandboxTrees=%D/devices/oneplus6/mkosi.sandbox
