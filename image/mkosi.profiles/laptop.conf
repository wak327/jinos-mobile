# jinOS for laptops (Intel): the same system and apps as the phone image, with
# Plasma Desktop instead of Plasma Mobile and firmware for laptop hardware.
#   mkosi -f --profile laptop build
# Outputs jinos-laptop.raw (USB stick image) and jinos-laptop.iso (live ISO);
# both can install jinOS with jinos-install. See devices/laptop/README.md.
[Output]
ImageId=jinos-laptop

[Content]
Packages=
        # Desktop session and login screen
        plasma-desktop
        plasma-workspace
        kwin-wayland
        sddm
        sddm-theme-breeze
        kde-config-sddm
        breeze
        systemsettings
        kscreen
        kde-config-gtk-style
        kde-config-screenlocker
        polkit-kde-agent-1
        xdg-desktop-portal-kde
        xdg-desktop-portal-gtk
        plasma-nm
        plasma-pa
        powerdevil
        power-profiles-daemon
        bluedevil
        bluez
        # Intel laptop hardware: Wi-Fi/Bluetooth, GPU, audio DSP, CPU microcode,
        # video decoding, thermal control, firmware updates.
        firmware-iwlwifi
        firmware-intel-graphics
        firmware-intel-sound
        firmware-intel-misc
        firmware-sof-signed
        firmware-realtek
        firmware-misc-nonfree
        intel-microcode
        intel-media-va-driver
        thermald
        fwupd
        # Plasma's monospace font; GTK apps such as Console are told to use it,
        # and without it their text is drawn widely spaced.
        fonts-hack
        # jinos-install: systemd-repart formats the new ESP (dosfstools) and
        # fills it (mtools); bootctl adds the firmware boot entry.
        dosfstools
        mtools
        systemd-boot-tools
        systemd-repart
        # Kernel updates: kernel-install builds a UKI per kernel (dracut for
        # the initramfs, ukify for the image) and systemd-boot's apt hook
        # runs it (/etc/kernel/install.conf). dracut also builds the ISO's
        # live initramfs.
        systemd-boot
        systemd-ukify
        dracut
        # dracut compresses initramfs images with zstd (dracut.conf.d/50-jinos.conf).
        zstd
ExtraTrees=%D/shells/desktop/mkosi.extra
ExtraTrees=%D/devices/laptop/mkosi.extra
UnifiedKernelImageProfiles=%D/devices/laptop/install.uki-profile
PostInstallationScripts=%D/shells/desktop/postinst.chroot
# The live ISO (mkosi.output/jinos-laptop.iso) next to the disk image.
PostInstallationScripts=%D/devices/laptop/postinst.chroot
PostOutputScripts=%D/devices/laptop/postoutput
