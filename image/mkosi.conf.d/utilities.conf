# Utility apps. Mostly Plasma Mobile's own (Kirigami), which are built for
# phone screens and touch; GNOME's where Plasma Mobile has none.
[Content]
Packages=
        # Everyday
        kclock
        kalk
        kweather
        calindori
        # Documents and media
        okular-mobile
        krecorder
        gnome-text-editor
        koko
        # Extras
        keysmith
        gnome-maps
        qrca
        # Command-line tools for the Console
        htop
        git
        curl
        wget
        unzip
        tree
