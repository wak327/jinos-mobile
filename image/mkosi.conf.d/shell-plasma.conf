# Default shell: Plasma Mobile with jinOS Home as the home screen.
# The Phosh variant is built with: mkosi --profile phosh build; the laptop
# build (mkosi --profile laptop build) uses Plasma Desktop instead.
[Match]
Profiles=!phosh
Profiles=!laptop

[Content]
Packages=
        plasma-mobile
        plasma-mobile-tweaks
        iio-sensor-proxy
        # Recommended, not depended on, so WithRecommends=no drops them:
        # without these Qt draws no SVG icons at all.
        qt6-svg-plugins
        qt6-image-formats-plugins
        # Battery data for Plasma and jinOS Home.
        upower
        # GTK apps read their icon theme from the settings portal. KDE's portal
        # doesn't provide one, so GTK fell back to "gnome", which doesn't
        # exist: missing icons and grey folders. KDE's portals.conf already
        # asks for this backend second (Settings=kde;gtk); it supplies Adwaita.
        xdg-desktop-portal-gtk
ExtraTrees=%D/shells/plasma/mkosi.extra
# Installs jinOS Home and makes it the default home screen.
PostInstallationScripts=%D/shells/plasma/postinst.chroot

[Build]
BuildSources=%D/../shell:shell
