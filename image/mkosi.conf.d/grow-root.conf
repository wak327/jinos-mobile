# PC disk images (default and Phosh builds): grow the root filesystem to fill
# the disk at boot. mkosi makes the root partition only slightly bigger than
# its contents; run-vm.sh enlarges the image file, real disks are bigger
# anyway. Not for the OnePlus 6 (its root is Android's userdata partition, and
# a root rule could create a partition on the phone's storage) or the laptop
# (jinos-install sizes the disk itself).
[Match]
Profiles=!laptop
Profiles=!oneplus6

[Content]
Packages=systemd-repart
ExtraTrees=%D/grow-root
