# Phone and messages. GNOME Calls and Chatty read names from Evolution Data
# Server, the address book jinOS Contacts writes to. Both talk to the modem
# through ModemManager (base image). Not on laptops.
[Match]
Profiles=!laptop

[Content]
Packages=
        gnome-calls
        # Lets Calls read the Evolution Data Server address book (folks
        # plugin); only recommended, and without it Calls shows no contacts.
        libfolks-eds26
        # Routes call audio (earpiece, speaker); only recommended by Calls.
        callaudiod
        chatty
        # Picture messages (MMS) for Chatty; only recommended.
        mmsd-tng
        # Ringtones, vibration and the notification LED for Calls and Chats
        # (they only link libfeedback; the daemon is merely recommended).
        feedbackd
