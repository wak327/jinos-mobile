# jinOS (OnePlus 6): never idle-suspend the sound card. During a call the
# modem's DSP carries the audio, so PipeWire sees no stream, suspends the
# speaker and microphone, and the call goes silent. Costs a little power.
# (Mobian/postmarketOS sdm845 notes; they toggle this per call instead.)
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
