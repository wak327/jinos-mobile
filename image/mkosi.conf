# jinOS base image. Debian forky + Phosh.
# Built for the host architecture by default so it runs under KVM;
# pass --architecture=arm64 for the phone / emulated variant.

[Distribution]
Distribution=debian
Release=forky
# Also written into the image's apt sources. The phone needs firmware from it.
Repositories=non-free-firmware

[Output]
OutputDirectory=mkosi.output
ImageId=jinos
Format=disk

[Content]
Bootable=yes
WithDocs=no
Hostname=jinos
Locale=C.UTF-8
PostInstallationScripts=scripts/postinst.chroot
# mkosi 26 default initrd omits Debian's separate mount package.
InitrdPackages=mount
Packages=
        systemd
        systemd-sysv
        systemd-boot-efi
        systemd-resolved
        udev
        dbus
        dbus-user-session
        polkitd
        libpam-systemd
        libcap2-bin
        kbd
        sudo
        passwd
        libglib2.0-bin
        apt
        # apt's configuration questions (debconf) need it to show a dialog.
        whiptail
        ca-certificates
        debian-archive-keyring
        iproute2
        less
        network-manager
        modemmanager
        pipewire
        pipewire-pulse
        wireplumber
        libgl1-mesa-dri
        libegl1
        libgles2
        gnome-console
        # Terminal text editor (the default "editor", e.g. for git commit).
        nano
        # File manager: GNOME Files adapts to phone screens. Its search uses
        # localsearch, an indexer that runs in the background.
        nautilus
        # Web browser: Firefox with postmarketOS/Mobian's phone layout.
        firefox-esr
        firefox-esr-mobile-config
        python3-gi
        gir1.2-gtk-4.0
        gir1.2-adw-1
        # jinos_ui: the jinOS font and the icon theme jinOS apps use in every shell.
        fonts-inter
        # Text in every script: most of the world's (including Urdu Nastaliq),
        # Chinese/Japanese/Korean, and colour emoji.
        fonts-noto-core
        fonts-noto-cjk
        fonts-noto-color-emoji
        adwaita-icon-theme
        evolution-data-server
        gir1.2-ebook-1.2
        gir1.2-ebookcontacts-1.2
        gir1.2-edataserver-1.2

[Build]
# jinOS's own apps; scripts/postinst.chroot installs them.
BuildSources=../apps:apps
CacheDirectory=mkosi.cache

[Runtime]
RAM=4G
CPUs=4
Console=gui
